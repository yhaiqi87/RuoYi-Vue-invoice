<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${data.invoiceTitle}">电子发票</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #eee
        }

        .page {
            position: relative;
            width: 210mm;
            height: 140mm;
            background: #fff;
            font-family: "SimSun", "Songti SC", serif;
            font-size: 9pt;
            color: #000;
            overflow: hidden
        }

        .kai {
            font-family: "KaiTi", "STKaiti", "AR PL UKai", serif
        }

        .song {
            font-family: "SimSun", "Songti SC", "AR PL UMing", serif
        }

        .cour {
            font-family: "Courier New", monospace
        }

        .el {
            color: #800000
        }

        .black {
            color: #000
        }

        /* 外框（边距 4.5mm，线 0.5mm 红褐） */
        .frame {
            position: absolute;
            left: 4.5mm;
            top: 4.5mm;
            width: 201mm;
            height: 131mm;
            border: 0.5mm solid #800000
        }

        /* 票头双线（18mm / 19mm，长 73mm 居中） */
        .dline {
            position: absolute;
            left: 68.5mm;
            width: 73mm;
            border-top: 0.25mm solid #800000
        }

        .dline.top {
            top: 18mm
        }

        .dline.bot {
            top: 19mm
        }

        /* 监制章（椭圆 30×20，中心 100.5/18） */
        .seal {
            position: absolute;
            left: 85.5mm;
            top: 8mm;
            width: 30mm;
            height: 20mm;
            border: 1mm solid #FF0000;
            border-radius: 50%;
            text-align: center;
            color: #FF0000;
            font-size: 7pt;
            line-height: 1.05;
            display: flex;
            flex-direction: column;
            justify-content: center
        }

        .seal-top {
            font-size: 4.5pt;
            letter-spacing: 0.2mm
        }

        .seal-mid {
            font-size: 7pt;
            font-weight: bold;
            margin: 0.4mm 0
        }

        .seal-bot {
            font-size: 6pt
        }

        /* 票头标题（楷体 20pt，水平居中，上缘 8mm） */
        .title {
            position: absolute;
            left: 0;
            top: 8mm;
            width: 210mm;
            text-align: center;
            font-size: 20pt;
            font-weight: bold
        }

        /* 发票号码 / 日期（左缘 155mm） */
        .invoiceno {
            position: absolute;
            left: 155mm;
            top: 8mm;
            font-size: 9pt
        }

        .invoicedate {
            position: absolute;
            left: 155mm;
            top: 13mm;
            font-size: 9pt
        }

        /* 二维码 20×20（左上角 7,6） */
        .qr {
            position: absolute;
            left: 7mm;
            top: 6mm;
            width: 20mm;
            height: 20mm
        }

        /* 标签 28×20（左上角 29,6） */
        .label {
            position: absolute;
            left: 29mm;
            top: 6mm;
            width: 28mm;
            height: 20mm;
            border: 0.5mm solid #800000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 9pt
        }

        /* 购销方区（30mm 起，高 22mm，4 列 6/94.5/6/94.5） */
        .buysell {
            position: absolute;
            left: 4.5mm;
            top: 30mm;
            width: 201mm;
            height: 22mm;
            border: 0.25mm solid #800000
        }

        .buysell:before {
            content: '';
            position: absolute;
            left: 100.5mm;
            top: 0;
            bottom: 0;
            border-left: 0.25mm solid #800000
        }

        .bs-label {
            position: absolute;
            font-size: 9pt
        }

        .bs-name {
            position: absolute;
            font-size: 9pt
        }

        .bs-taxid {
            position: absolute;
            font-size: 12pt
        }

        .bs-contact {
            position: absolute;
            font-size: 7.5pt
        }

        /* 应税明细 + 合计 + 价税合计（52mm 起，高 52mm） */
        .detail {
            position: absolute;
            left: 4.5mm;
            top: 52mm;
            width: 201mm;
            height: 52mm;
            border: 0.25mm solid #800000
        }

        table.grid {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed
        }

        table.grid th, table.grid td {
            border: 0.25mm solid #800000;
            height: 4.375mm;
            padding: 0 1mm;
            font-size: 9pt;
            vertical-align: middle;
            overflow: hidden
        }

        table.grid thead th {
            height: 4.5mm
        }

        table.grid tr.total td {
            height: 4.5mm
        }

        .pricetotal {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 201mm;
            height: 8mm;
            border-top: 0.25mm solid #800000;
            display: flex;
            align-items: center
        }

        .pt-left {
            width: 125mm;
            padding-left: 1mm;
            font-size: 9pt
        }

        .pt-right {
            width: 76mm;
            border-left: 0.25mm solid #800000;
            padding-left: 1mm;
            font-size: 9pt
        }

        .pt-right .cour {
            font-size: 11pt
        }

        /* 备注（104mm 起，高 20mm，2 列 6/195） */
        .note {
            position: absolute;
            left: 4.5mm;
            top: 104mm;
            width: 201mm;
            height: 20mm;
            border: 0.25mm solid #800000
        }

        .note-label {
            position: absolute;
            font-size: 9pt
        }

        .note-body {
            position: absolute;
            left: 9mm;
            top: 4mm;
            right: 1mm;
            bottom: 1mm;
            font-size: 8pt;
            white-space: pre-wrap;
            line-height: 1.3
        }

        /* 票尾（下缘 7.5mm） */
        .footer {
            position: absolute;
            left: 5.5mm;
            top: 132.5mm;
            font-size: 9pt
        }

        /* 右框色带（金 + 咖，右下 1/2 区，高 0.54mm） */
        .band {
            position: absolute;
            left: 204.5mm;
            width: 1mm;
            height: 0.54mm
        }

        .band.gold {
            top: 130mm;
            background: #F6EDE1
        }

        .band.brown {
            top: 129.4mm;
            background: #765954
        }

        /* 红字水印 */
        .watermark {
            position: absolute;
            left: 0;
            top: 0;
            width: 210mm;
            height: 140mm;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60pt;
            color: rgba(255, 0, 0, 0.12);
            transform: rotate(-20deg);
            pointer-events: none
        }

        @page {
            size: 210mm 140mm;
            margin: 0
        }

        @media print {
            body {
                background: #fff
            }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="frame"></div>
    <div class="dline top"></div>
    <div class="dline bot"></div>

    <div class="seal kai">
        <div class="seal-top">全国统一发票监制章</div>
        <div class="seal-mid">国家税务总局</div>
        <div class="seal-bot" th:text="${data.taxBureauName}">xx省税务局</div>
    </div>

    <div class="title kai el" th:text="${data.invoiceTitle}">电子发票（普通发票）</div>
    <div class="invoiceno song">发票号码：<span th:text="${data.invoiceNo}">发票号码</span></div>
    <div class="invoicedate song">开票日期：<span th:text="${data.issueDate}">开票日期</span></div>

    <img alt="qr" class="qr" th:if="${qrUri != null and qrUri != ''}" th:src="${qrUri}"/>
    <div class="label kai el" th:if="${data.labelText != null and data.labelText != ''}" th:text="${data.labelText}">
        差额征税-差额开票
    </div>

    <div class="buysell">
        <div class="bs-label kai el" style="left:10.5mm;top:35mm">购买方</div>
        <div class="bs-label kai el" style="left:111mm;top:35mm">销售方</div>
        <div class="bs-name song" style="left:10.5mm;top:36.5mm">名称：<span th:text="${data.buyerName}"></span></div>
        <div class="bs-name song" style="left:111mm;top:36.5mm">名称：<span th:text="${data.sellerName}"></span></div>
        <div class="bs-taxid cour" style="left:10.5mm;top:44mm">纳税人识别号：<span th:text="${data.buyerTaxId}"></span>
        </div>
        <div class="bs-taxid cour" style="left:111mm;top:44mm">纳税人识别号：<span th:text="${data.sellerTaxId}"></span>
        </div>
        <div class="bs-contact song" style="left:10.5mm;top:48mm"
             th:if="${data.showBuyerContact or data.showBuyerBank}" th:text="${buyerContact}"></div>
        <div class="bs-contact song" style="left:111mm;top:48mm"
             th:if="${data.showSellerContact or data.showSellerBank}" th:text="${sellerContact}"></div>
    </div>

    <div class="detail">
        <table class="grid">
            <colgroup>
                <col style="width:37mm">
                <col style="width:24mm">
                <col style="width:12mm">
                <col style="width:25mm">
                <col style="width:25mm">
                <col style="width:26mm">
                <col style="width:25mm">
                <col style="width:27mm">
            </colgroup>
            <thead>
            <tr>
                <th class="kai el">项目名称</th>
                <th class="kai el">规格型号</th>
                <th class="kai el">单位</th>
                <th class="kai el">数量</th>
                <th class="kai el">单价</th>
                <th class="kai el">金额</th>
                <th class="kai el">税率/征收率</th>
                <th class="kai el">税额</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${rows}">
                <td class="song" style="text-align:left;padding-left:1mm" th:text="${row.name}"></td>
                <td class="song" style="text-align:left;padding-left:1mm" th:text="${row.spec}"></td>
                <td class="kai" style="text-align:center" th:text="${row.unit}"></td>
                <td class="song" style="text-align:right;padding-right:1mm" th:text="${row.quantity}"></td>
                <td class="song" style="text-align:right;padding-right:1mm" th:text="${row.price}"></td>
                <td class="song" style="text-align:right;padding-right:1mm" th:text="${row.amount}"></td>
                <td class="kai" style="text-align:center" th:text="${row.taxRate}"></td>
                <td class="song" style="text-align:right;padding-right:1mm" th:text="${row.tax}"></td>
            </tr>
            <tr class="total">
                <td class="kai el" style="text-align:left;padding-left:1mm">合计</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td class="song" style="text-align:right;padding-right:1mm" th:text="${data.totalAmount}"></td>
                <td></td>
                <td class="song" style="text-align:right;padding-right:1mm" th:text="${data.totalTax}"></td>
            </tr>
            </tbody>
        </table>
        <div class="pricetotal">
            <div class="pt-left kai el">价税合计（大写）<span class="song black"
                                                            th:text="${data.totalAmountUpper}"></span></div>
            <div class="pt-right kai el">价税合计（小写）<span class="cour black">¥<span
                    th:text="${data.totalAmountLower != null ? #strings.replace(data.totalAmountLower,'¥','') : ''}"></span></span>
            </div>
        </div>
    </div>

    <div class="note">
        <div class="note-label kai el" style="left:3mm;top:4mm">备注</div>
        <div class="note-body song" th:if="${data.remark != null and data.remark != ''}" th:text="${data.remark}"></div>
    </div>

    <div class="footer song">开票人：<span th:text="${data.drawer}"></span></div>

    <div class="band gold"></div>
    <div class="band brown"></div>

    <div class="watermark kai" th:if="${data.redLetter}" th:text="${redLetterText}">红字</div>
</div>
</body>
</html>
